name: Comprobar Tesorería y generar APK de prueba
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Dependencias y comprobaciones
        run: |
          flutter pub get
          dart format lib test
          flutter analyze --no-fatal-infos
          flutter test
      - name: Generar APK debug
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: NA-Tesoreria-APK-prueba
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            pubspec.lock
          retention-days: 7
